name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Check if release already exists
        id: preflight
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $TAG already exists — nothing to deploy."
          elif git rev-parse "$TAG^{tag}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $TAG already exists — nothing to deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: steps.preflight.outputs.skip != 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Build packages
        if: steps.preflight.outputs.skip != 'true'
        run: pnpm -r build

      - name: Build Swift audio sidecar
        if: steps.preflight.outputs.skip != 'true'
        run: bash scripts/build-sidecar.sh

      - name: Rebuild native modules for Electron
        if: steps.preflight.outputs.skip != 'true'
        run: pnpm --filter desktop exec electron-builder install-app-deps

      - name: Generate release notes
        if: steps.preflight.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          OUT="apps/desktop/resources/release-notes.md"
          PREV=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || true)
          ARGS=(-f "tag_name=${TAG}" -f "target_commitish=${{ github.sha }}")
          if [ -n "$PREV" ]; then
            ARGS+=(-f "previous_tag_name=${PREV}")
          fi
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            "${ARGS[@]}" --jq .body > "$OUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder reads release-notes.md from resources/ and publishes
      # a GitHub release tagged v<version> with those notes.
      - name: Package, sign, notarize, and publish macOS app
        if: steps.preflight.outputs.skip != 'true'
        run: pnpm --filter desktop package:mac --publish always
        env:
          CI: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload build artifacts (debugging)
        if: always() && steps.preflight.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: notetaker-mac-v${{ steps.version.outputs.version }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: warn
          retention-days: 14
