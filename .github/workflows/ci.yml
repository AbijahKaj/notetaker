name: CI

on:
  # push:
  #   branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build workspace packages first so their emitted .d.ts files exist
      # before downstream packages typecheck against @notetaker/core.
      - run: pnpm -r build

      - run: pnpm typecheck

      - run: pnpm --filter desktop build

      - name: Build Swift sidecar
        run: bash scripts/build-sidecar.sh
